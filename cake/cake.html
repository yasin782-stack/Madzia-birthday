<div class="cake-component" id="birthdayCake">
  <div class="cake-spotlight"></div>

  <div class="cake-wrapper">
    <div class="cake-plate"></div>
    <div class="candle-glow"></div>

    <div class="cake-base">
      <div class="cake-top"></div>

      <div class="cake-frosting">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="strawberries">
        <span class="strawberry">🍓</span>
        <span class="strawberry">🍓</span>
        <span class="strawberry">🍓</span>
      </div>

      <div class="cake-name">Madzia</div>
    </div>

    <div class="candles">
      <div class="candle">
        <div class="flame"></div>
        <div class="candle-stick"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="candle-stick"></div>
      </div>

      <div class="candle">
        <div class="flame"></div>
        <div class="candle-stick"></div>
      </div>
    </div>
  </div>

  <div id="candleMessage" class="candle-message">
    Make a wish... ✨
  </div>

  <div id="blowInstruction" class="blow-instruction">
    Blow gently toward your microphone 🎤
  </div>

  <div class="cake-controls">
    <button id="startMicButton" class="cake-button" type="button" onclick="startMic()">
      🎤 Blow Candles
    </button>

    <button id="blowFallbackButton" class="cake-button secondary" type="button" onclick="blowCandles()">
      ✨ Tap to Blow
    </button>
  </div>

  <div id="cakeMessage" class="cake-message">
    Happy Birthday, Madzia! 🎂✨
  </div>

  <button id="cakeContinue" class="cake-continue" type="button" onclick="showScreen('celebration')">
    Continue ✨
  </button>
</div>
